[project]
name = "health-report-analyser"
version = "0.2.0"
description = "AI-assisted health/blood test report analysis with PII redaction, structured extraction, diet planning, and chat."
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.38",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "langchain-community>=0.3",
    "pypdf>=4.3",
    "pymupdf>=1.24",
    "langchain-tavily>=0.1",
    "tenacity>=9.0",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "*.py",
]
